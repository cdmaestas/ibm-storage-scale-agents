[project]
name = "scale-agents"
version = "0.1.0"
description = "IBM Storage Scale Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.3",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.5",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.0",
]
anthropic = [
    "langchain-anthropic>=1.0",
]
aws = [
    "langchain-aws>=1.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
