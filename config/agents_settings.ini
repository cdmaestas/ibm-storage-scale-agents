[llm]
# provider selects the backend: ollama | openai | anthropic | azure | bedrock
#   - openai covers any OpenAI-compatible endpoint: OpenAI, vLLM, LM Studio,
#     llama.cpp server, Together, Groq, ...
#   - azure requires the 'openai' extra; bedrock requires the 'aws' extra;
#     anthropic requires the 'anthropic' extra (ollama is built in).
# If provider is omitted, a legacy "provider/model" prefix on model_name is
# honored (e.g. ollama_chat/qwen3:latest), otherwise ollama is assumed.
provider = ollama
model_name = qwen3:latest
# base_url: Ollama server (default http://localhost:11434), an OpenAI-compatible
# endpoint (e.g. vLLM: http://HOST:8000/v1), or the Azure OpenAI endpoint.
base_url = http://localhost:11434
# Timeout for LLM operations in seconds
timeout = 180
# temperature = 0
# azure_api_version =        # required for provider = azure
# aws_region =               # optional for provider = bedrock (else AWS_REGION)
#
# API keys are read from the environment ONLY (never from this file):
#   SCALE_AGENTS_LLM_API_KEY   (openai / anthropic / azure)
# or the provider's native var (OPENAI_API_KEY, ANTHROPIC_API_KEY,
# AZURE_OPENAI_API_KEY); bedrock uses the standard AWS credential chain.
# Any setting above can also be overridden via SCALE_AGENTS_LLM_<KEY>, e.g.
# SCALE_AGENTS_LLM_PROVIDER, SCALE_AGENTS_LLM_MODEL, SCALE_AGENTS_LLM_BASE_URL.

[mcp]
# Supported transports: stdio, http
# For stdio: use command and args (e.g., command=scale-mcp-server)
# For http use url (e.g., url=http://127.0.0.1:8000/mcp)
# transport = stdio
# command = <path/>.local/bin/uv
# args = --directory </path/to/ibm-storage-scale-mcp-server> run scale-mcp-server --transport stdio
transport = http
url = http://127.0.0.1:8000/mcp
# Timeout for MCP client HTTP requests in seconds
timeout = 30

[logging]
level = DEBUG
format = json
log_path = logs/agents.log
max_bytes = 10485760
backup_count = 5
