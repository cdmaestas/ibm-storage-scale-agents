# Run the agents in a container. Configuration is entirely env-driven; copy
# .env.example to .env and edit, then:
#
#   docker compose run --rm agent                 # use an existing LLM + MCP server
#   docker compose --profile ollama up -d ollama  # (optional) also run Ollama locally
#   docker compose --profile ollama run --rm agent
#
# `run --rm` is used rather than `up` because main.py is an interactive CLI.

services:
  agent:
    build:
      context: .
      args:
        # Provider extras to bake in, e.g. "--extra openai". Default: ollama only.
        EXTRAS: ${SCALE_AGENTS_EXTRAS:-}
    image: scale-agents:latest
    # Interactive CLI needs an attached terminal.
    stdin_open: true
    tty: true
    environment:
      # --- LLM (see src/utils/llm_factory.py) ---
      SCALE_AGENTS_LLM_PROVIDER: ${SCALE_AGENTS_LLM_PROVIDER:-ollama}
      SCALE_AGENTS_LLM_MODEL: ${SCALE_AGENTS_LLM_MODEL:-qwen3:latest}
      # For the bundled Ollama service use http://ollama:11434; for a host-run
      # backend use http://host.docker.internal:11434 (or your server URL).
      SCALE_AGENTS_LLM_BASE_URL: ${SCALE_AGENTS_LLM_BASE_URL:-http://ollama:11434}
      SCALE_AGENTS_LLM_API_KEY: ${SCALE_AGENTS_LLM_API_KEY:-}
      # --- MCP server (external) ---
      SCALE_AGENTS_MCP_URL: ${SCALE_AGENTS_MCP_URL:-http://host.docker.internal:8000/mcp}
    extra_hosts:
      # Lets the container reach services running on the Docker host.
      - "host.docker.internal:host-gateway"

  # Optional local Ollama. Enable with:  docker compose --profile ollama ...
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
